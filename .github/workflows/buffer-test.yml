name: Buffer Connection Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-buffer:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose Buffer API connection
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          token = os.environ.get("BUFFER_API_KEY", "")

          if not token:
              print("ERROR: BUFFER_API_KEY is missing or empty.")
              raise SystemExit(1)

          print("Secret exists. Sending test request to Buffer...")

          query = """
          query GetOrganizations {
            account {
              organizations {
                id
                name
              }
            }
          }
          """

          request = urllib.request.Request(
              "https://api.buffer.com",
              data=json.dumps({"query": query}).encode("utf-8"),
              headers={
                  "Authorization": "Bearer " + token,
                  "Content-Type": "application/json",
              },
              method="POST",
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  print("HTTP status:", response.status)
                  body = response.read().decode("utf-8")
          except urllib.error.HTTPError as error:
              print("HTTP status:", error.code)
              body = error.read().decode("utf-8", errors="replace")
          except Exception as error:
              print("Request failed:", type(error).__name__, str(error))
              raise SystemExit(1)

          try:
              data = json.loads(body)
              print("Buffer response:")
              print(json.dumps(data, indent=2))

              if data.get("errors"):
                  print("GraphQL returned errors.")
                  raise SystemExit(1)

              organizations = data.get("data", {}).get(
                  "account", {}
              ).get("organizations", [])

              if not organizations:
                  print("No organizations returned. Check the response above.")
                  raise SystemExit(1)

              print("SUCCESS: Buffer authentication works.")
              print("Organizations found:", len(organizations))

          except json.JSONDecodeError:
              print("Buffer returned a non-JSON response:")
              print(body[:3000])
              raise SystemExit(1)
          PY

