name: Buffer Connection Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-buffer:
    runs-on: ubuntu-latest
    steps:
      - name: List Buffer channels
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ["BUFFER_API_KEY"]
          endpoint = "https://api.buffer.com"

          def query_buffer(query):
              request = urllib.request.Request(
                  endpoint,
                  data=json.dumps({"query": query}).encode(),
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )

              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.loads(response.read().decode())

              if result.get("errors"):
                  raise RuntimeError(
                      json.dumps(result["errors"], indent=2)
                  )

              return result["data"]

          organizations = query_buffer("""
              query {
                account {
                  organizations {
                    id
                    name
                  }
                }
              }
          """)["account"]["organizations"]

          for organization in organizations:
              print("Organization:", organization["name"])

              org_id = json.dumps(organization["id"])
              query = f"""
                  query {{
                    channels(input: {{
                      organizationId: {org_id}
                    }}) {{
                      id
                      name
                      service
                    }}
                  }}
              """

              channels = query_buffer(query)["channels"]
              print("Channels found:", len(channels))

              for channel in channels:
                  print(
                      "Channel:", channel["name"],
                      "| Platform:", channel["service"],
                      "| ID:", channel["id"]
                  )

          print("SUCCESS: Channel lookup complete.")
          PY
