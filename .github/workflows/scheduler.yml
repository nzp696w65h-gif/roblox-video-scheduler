name: Roblox Video Scheduler

on:
  schedule:
    - cron: "0 10,17 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  select-video:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Select next video
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          videos = json.loads(
              Path("videos.json").read_text()
          )

          enabled = [
              video for video in videos
              if video.get("enabled", True)
          ]

          if not enabled:
              raise SystemExit("No enabled videos found.")

          state_path = Path("state.json")
          state = json.loads(state_path.read_text())

          index = state.get("next_index", 0) % len(enabled)
          video = enabled[index]

          print("PREVIEW ONLY — nothing will be posted.")
          print("Selected video:", video["video"])
          print("Caption:", video["caption"])

          state["next_index"] = (index + 1) % len(enabled)

          state_path.write_text(
              json.dumps(state, indent=2) + "\n"
          )
          PY

      - name: Save rotation progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add state.json
          git commit -m "Update video rotation state"
          git push
