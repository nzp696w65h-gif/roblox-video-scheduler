
name: Roblox Video Scheduler

on:
  schedule:
    - cron: "0 8,15 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Actually create posts in Buffer"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: roblox-video-scheduler
  cancel-in-progress: false

jobs:
  select-and-post:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v5

      - name: Select video and post to Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish == true }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import random
          from pathlib import Path
          from urllib.request import Request, urlopen

          videos = json.loads(Path("videos.json").read_text())

          enabled = [
              video for video in videos
              if video.get("enabled", True)
          ]

          if not enabled:
              raise SystemExit("No enabled videos found.")

          state_path = Path("state.json")
          state = json.loads(state_path.read_text())

          last_video = state.get("last_video")
          candidates = [
              video for video in enabled
              if video["video"] != last_video
          ]

          if not candidates:
              candidates = enabled

          video = random.choice(candidates)

          video_path = Path(video["video"])
          if not video_path.is_file():
              raise SystemExit(f"Video file not found: {video_path}")

          video_url = (
              "https://raw.githubusercontent.com/"
              "nzp696w65h-gif/roblox-video-scheduler/main/"
              + video["video"]
          )

          caption = (
              video["title"] + "\n\n"
              + video["cta"] + "\n\n"
              + video["hashtags"]
          )

          channels = {
              "CondosPublic": "6ad0e090778b240e2f1948ac",
              "Roblox4Adults": "6ad0df6a778b240e2f193961",
              "ALLROBLOXCONDOS": "6acc90a9778b240e2fe3ee2a",
          }

          print("Selected video:", video["video"])
          print("Enabled videos:", len(enabled))
          print("Caption:\n" + caption)

          if os.environ.get("PUBLISH", "").lower() != "true":
              print("PREVIEW ONLY - no posts created; rotation unchanged.")
              raise SystemExit(0)

          token = os.environ.get("BUFFER_API_KEY")
          if not token:
              raise SystemExit("BUFFER_API_KEY secret is missing.")

          def create_post(channel_name, channel_id):
              query = f"""
              mutation CreateRobloxVideoPost {{
                createPost(input: {{
                  text: {json.dumps(caption, ensure_ascii=False)}
                  channelId: "{channel_id}"
                  schedulingType: automatic
                  mode: addToQueue
                  assets: [
                    {{ video: {{ url: {json.dumps(video_url)} }} }}
                  ]
                }}) {{
                  ... on PostActionSuccess {{
                    post {{
                      id
                      text
                      dueAt
                    }}
                  }}
                  ... on MutationError {{
                    message
                  }}
                }}
              }}
              """

              payload = json.dumps({"query": query}).encode("utf-8")

              request = Request(
                  "https://api.buffer.com",
                  data=payload,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )

              with urlopen(request, timeout=60) as response:
                  result = json.loads(response.read().decode("utf-8"))

              if result.get("errors"):
                  raise RuntimeError(
                      f"{channel_name}: {json.dumps(result['errors'])}"
                  )

              action = result.get("data", {}).get("createPost", {})

              if action.get("message"):
                  raise RuntimeError(
                      f"{channel_name}: {action['message']}"
                  )

              post = action.get("post")
              if not post:
                  raise RuntimeError(
                      f"{channel_name}: Buffer returned no post."
                  )

              print(
                  f"Created post for {channel_name}: "
                  f"{post.get('id')} | due: {post.get('dueAt')}"
              )

          for name, channel_id in channels.items():
              create_post(name, channel_id)

          state["last_video"] = video["video"]
          state_path.write_text(
              json.dumps(state, indent=2) + "\n"
          )

          print("All 3 posts created. Rotation state updated.")

      - name: Save rotation progress
        if: ${{ success() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state.json

          if git diff --cached --quiet; then
            echo "No state changes to save."
            exit 0
          fi

          git commit -m "Update video rotation state"
          git push
